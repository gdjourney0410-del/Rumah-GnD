<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kas Rumah</title>
<meta name="theme-color" content="#1E5B4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kas Rumah">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#F5F8F6; --ink:#15302A; --muted:#5A6D67; --line:#D6DFDA;
  --brand:#1E5B4E; --brand-ink:#FFFFFF; --accent:#D6951A;
  --a:#B4466A; --b:#3A5A9A; --danger:#B3261E; --ok:#2B7A57;
  --radius-lg:18px; --radius:10px; --radius-sm:6px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1715; --surface:#16211E; --sunk:#1B2824; --ink:#E4EDEA; --muted:#98ABA5; --line:#2A3A35;
    --brand:#5FB39E; --brand-ink:#0C1613; --accent:#E8B24A;
    --a:#E27E9F; --b:#86A2DD; --danger:#F08A80; --ok:#6CC79C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#16211E; --sunk:#1B2824; --ink:#E4EDEA; --muted:#98ABA5; --line:#2A3A35;
  --brand:#5FB39E; --brand-ink:#0C1613; --accent:#E8B24A;
  --a:#E27E9F; --b:#86A2DD; --danger:#F08A80; --ok:#6CC79C; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 48px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:linear-gradient(90deg,var(--a) 0 50%,var(--b) 50% 100%)}
.period{display:flex;align-items:center;gap:4px;margin-left:auto}
.period button{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.period .lbl{min-width:170px;text-align:center;font-weight:700}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;width:100%}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:var(--ok)}
.sync.local::before{background:var(--accent)}
nav.tabs{max-width:1040px;margin:0 auto;padding:6px 12px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.grid2{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:14.5px;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
section.view{padding-top:18px;display:grid;gap:16px}
section.view[hidden]{display:none}

/* form */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.who button[aria-pressed="true"][data-m="a"]{background:var(--a);color:#fff}
.seg.who button[aria-pressed="true"][data-m="b"]{background:var(--b);color:#fff}
.field{display:grid;gap:5px;margin-top:12px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-height:42px}
input.amount{font-size:24px;font-weight:700;padding:10px 12px}
.amountwrap{position:relative}
.amountwrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);font-size:18px}
.amountwrap input{padding-left:44px}
.btn{border:0;border-radius:var(--radius);padding:11px 16px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .btn:first-child{flex:1}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:1em}

/* list */
.txlist{list-style:none;margin:0;padding:0}
.txlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.txlist li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%}
.dot.a{background:var(--a)} .dot.b{background:var(--b)}
.txt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt span{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.amt.out{color:var(--ink)} .amt.in{color:var(--ok)} .amt.tf{color:var(--muted)}
.rowbtns{grid-column:2 / 4;display:flex;gap:6px;justify-content:flex-end}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
.linkbtn.warn{color:var(--danger)}
.dayhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);padding:14px 0 4px;border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters select{width:auto;min-height:36px;padding:6px 10px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

/* summary */
.big{font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:16px}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-size:18px;font-weight:700}
.strip{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-top:18px;background:var(--sunk)}
.strip span{height:100%;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);margin:10px 0}
.split .a{background:var(--a)} .split .b{background:var(--b)}
.splitrow{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.cats{list-style:none;margin:0;padding:0}
.cats li{padding:12px 0;border-top:1px solid var(--line)}
.cats li:first-child{border-top:0}
.cathead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cathead b{font-weight:600}
.pct{display:inline-block;min-width:48px;text-align:right;color:var(--muted);font-weight:600;font-size:13px}
.track{height:8px;background:var(--sunk);border-radius:4px;margin:7px 0 5px;overflow:hidden;position:relative}
.track span{display:block;height:100%;border-radius:4px}
.catmeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.over{color:var(--danger);font-weight:700}
.under{color:var(--ok);font-weight:600}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;color:var(--muted);font-weight:700}
tfoot td{font-weight:800;border-bottom:0}
td.end{font-weight:700}
td .note{display:block;font-size:12px;color:var(--muted);font-weight:500}
.neg{color:var(--danger)}
table.budget{min-width:520px}
table.budget input{max-width:170px;text-align:right;min-height:36px;padding:6px 10px;margin-left:auto;display:block}

/* settings */
.editlist{display:grid;gap:8px}
.editrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.editrow.acc{grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1.1fr) auto}
@media (max-width:760px){.editrow.acc{grid-template-columns:1fr 1fr;padding:10px 0;border-top:1px solid var(--line)}.editrow.acc>:first-child{grid-column:1 / 3}.editrow.acc>button{grid-column:1 / 3;justify-self:end}}
.editrow.acc select{min-height:42px;padding:8px 10px}
.acchead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1.1fr) auto;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);padding-right:84px}
@media (max-width:760px){.acchead{display:none}}
.addrow select{width:auto;min-height:42px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
.inline input{width:auto}
tr.grp th{text-align:left;background:var(--sunk);color:var(--ink);font-size:13.5px;padding-top:12px}
tr.sub td{font-weight:700;background:var(--sunk)}
td .kind{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.editrow.archived input{opacity:.55}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.addrow input{flex:1 1 180px}

.sumhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dl{display:flex;gap:8px}
.pies{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.pies{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.piehead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.piehead .dot{display:inline-block}
.piehead .num{margin-left:auto;font-weight:700}
.pierow{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.pierow svg{flex:none}
.pielegend{list-style:none;margin:0;padding:0;flex:1 1 180px;min-width:0;font-size:13px}
.pielegend li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:3px 0}
.pielegend i{width:10px;height:10px;border-radius:2px}
.pielegend .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pielegend .p{color:var(--muted);font-weight:600;font-size:12px}
.pielegend .v{font-weight:600;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><i aria-hidden="true"></i>Kas Rumah</div>
    <div class="period">
      <button id="prevP" aria-label="Periode sebelumnya">‹</button>
      <div class="lbl" id="pLabel">—</div>
      <button id="nextP" aria-label="Periode berikutnya">›</button>
    </div>
    <div class="sync local" id="sync">Tersimpan di perangkat ini</div>
  </div>
  <nav class="tabs" role="tablist">
    <button data-tab="catat" aria-selected="true">Catat</button>
    <button data-tab="ringkas" aria-selected="false">Ringkasan</button>
    <button data-tab="saldo" aria-selected="false">Saldo akun</button>
    <button data-tab="trx" aria-selected="false">Transaksi</button>
    <button data-tab="anggaran" aria-selected="false">Anggaran</button>
    <button data-tab="sinkron" aria-selected="false">Gabung data</button>
    <button data-tab="atur" aria-selected="false">Pengaturan</button>
  </nav>
</header>

<main class="wrap">
  <section class="view" id="v-catat">
    <div class="grid2">
      <div class="panel">
        <h2 id="formTitle">Catat transaksi</h2>
        <div class="seg" id="typeSeg">
          <button data-t="out" aria-pressed="true">Pengeluaran</button>
          <button data-t="in" aria-pressed="false">Pemasukan</button>
          <button data-t="tf" aria-pressed="false">Transfer</button>
        </div>
        <div class="field">
          <span class="flabel">Dicatat oleh</span>
          <div class="seg who" id="whoSeg"></div>
        </div>
        <div class="field">
          <label for="fAmt">Nominal</label>
          <div class="amountwrap"><span>Rp</span><input id="fAmt" class="amount num" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></div>
        </div>
        <div class="row">
          <div class="field"><label for="fDate">Tanggal</label><input id="fDate" type="date"></div>
          <div class="field"><label for="fAcc" id="lAcc">Dibayar dari</label><select id="fAcc"></select></div>
        </div>
        <div class="field"><label for="fCat" id="lCat">Akun beban</label><select id="fCat"></select></div>
        <div class="field"><label for="fNote">Catatan</label><input id="fNote" type="text" placeholder="mis. belanja sayur di pasar" maxlength="140"></div>
        <div class="err" id="fErr"></div>
        <div class="actions">
          <button class="btn" id="fSave">Simpan pengeluaran</button>
          <button class="btn ghost" id="fCancel" hidden>Batal ubah</button>
        </div>
      </div>
      <div class="panel">
        <h2>Terbaru di periode ini</h2>
        <ul class="txlist" id="recent"></ul>
      </div>
    </div>
  </section>

  <section class="view" id="v-ringkas" hidden></section>
  <section class="view" id="v-saldo" hidden></section>
  <section class="view" id="v-trx" hidden>
    <div class="panel">
      <div class="filters" style="justify-content:space-between;align-items:center">
        <div class="filters">
          <select id="flType" aria-label="Jenis"><option value="">Semua jenis</option><option value="out">Pengeluaran</option><option value="in">Pemasukan</option><option value="tf">Transfer</option></select>
          <select id="flWho" aria-label="Pencatat"></select>
          <select id="flCat" aria-label="Akun beban"></select>
        </div>
        <button class="btn ghost sm" id="csvBtn">Unduh CSV</button>
      </div>
      <div id="trxBody"></div>
    </div>
  </section>
  <section class="view" id="v-anggaran" hidden></section>
  <section class="view" id="v-sinkron" hidden></section>
  <section class="view" id="v-atur" hidden></section>
</main>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const LK='kasrumah:data:v2', MEK='kasrumah:me', METAK='kasrumah:meta';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function ymd(y,m,d){const t=new Date(y,m-1,d);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function today(){const t=new Date();return ymd(t.getFullYear(),t.getMonth()+1,t.getDate());}
function parts(s){return s.split('-').map(Number);}
const rp=n=>{n=Math.round(n||0);return (n<0?'−':'')+'Rp '+Math.abs(n).toLocaleString('id-ID');};
const pctf=x=>(isFinite(x)?(x*100).toLocaleString('id-ID',{maximumFractionDigits:1}):'0')+'%';
const MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MONS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const PALETTE=['#1E5B4E','#D6951A','#B4466A','#3A5A9A','#6B8E23','#C0573E','#7A4E9C','#2A8C9A','#A67C52','#5C6B73','#D16D9E','#4F9D69','#8C6D1F','#3E7CB1','#9B5DE5','#7F8C8D','#E07B39','#2F6F8F','#A33B3B','#5E8C31','#B08D2E','#6A5ACD'];
const KINDS=[['cash','Tunai'],['bank','Bank'],['ewallet','E-wallet'],['aset','Aset']];
const kindLabel=k=>(KINDS.find(x=>x[0]===k)||['','Lainnya'])[1];
const kindOrder=k=>{const i=KINDS.findIndex(x=>x[0]===k);return i<0?9:i;};
function clone(o){return JSON.parse(JSON.stringify(o));}
function fmtDate(d){const [y,m,dd]=parts(d);return dd+' '+MONS[m-1]+' '+y;}
function fmtTime(ms){if(!ms)return 'belum pernah';const d=new Date(ms);return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})+' pukul '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}

const today0=today();
const [ty,tm]=parts(today0);
const OD=ymd(ty,tm,1);
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'');
const mkAcc=(owner,list)=>list.map(([n,k])=>({id:'a'+(owner||'x')+'-'+slug(n),name:n,owner,kind:k,open:0,openDate:OD}));
const DEF={
  u:0,
  members:[{id:'a',name:'Istri'},{id:'b',name:'Suami'}],
  startDay:1,
  accounts:[
    ...mkAcc('b',[['Cash','cash'],['BCA','bank'],['Permata','bank'],['Blu','bank'],['Gopay','ewallet'],['Shopeepay','ewallet'],['OVO','ewallet']]),
    ...mkAcc('a',[['Cash','cash'],['BRI','bank'],['BNI','bank'],['Mandiri','bank'],['Jago','bank'],['Gopay','ewallet'],['Shopeepay','ewallet'],['OVO','ewallet']]),
    ...mkAcc('',[['Bibit','aset'],['Tring','aset']])
  ],
  expense:['Listrik & Air','Komunikasi','Sewa Rumah','Belanja Rumah','Perawatan Rumah','Groceries','Makan','Snack','Skincare','Transportasi','Perawatan Kendaraan','Kesehatan','Pendidikan','Hiburan','Biaya Administrasi','Bunga/Biaya PayLater','Pengeluaran Lainnya'].map(n=>({id:'c-'+slug(n),name:n})),
  income:['Gaji','Bonus','Freelance','Usaha','Pendapatan Lainnya'].map(n=>({id:'p-'+slug(n),name:n}))
};

/* ---------- storage (perangkat ini) ---------- */
const S={cfg:clone(DEF),tx:{},budget:{}};
let meta={sent:0,recv:0,backup:0};
function normCfg(c){
  c=clone(c||{});const d=clone(DEF);
  if(!Array.isArray(c.members)||c.members.length!==2)c.members=d.members;
  c.startDay=Math.min(28,Math.max(1,parseInt(c.startDay)||1));
  ['accounts','expense','income'].forEach(k=>{if(!Array.isArray(c[k]))c[k]=d[k];});
  c.accounts.forEach(a=>{if(!a.kind)a.kind='bank';if(a.owner!=='a'&&a.owner!=='b')a.owner='';});
  c.u=+c.u||0;
  return c;
}
function load(){
  try{const j=JSON.parse(localStorage.getItem(LK)||'null');if(j){S.cfg=normCfg(j.cfg);S.tx=j.tx||{};S.budget=j.budget||{};}}catch(e){}
  if(!S.cfg.u)S.cfg=clone(DEF); /* belum pernah diatur: pakai daftar akun keluarga */
  try{meta=Object.assign(meta,JSON.parse(localStorage.getItem(METAK)||'{}'));}catch(e){}
}
function persist(){
  try{localStorage.setItem(LK,JSON.stringify({cfg:S.cfg,tx:S.tx,budget:S.budget}));}
  catch(e){toast('Gagal menyimpan. Memori browser penuh atau mode penyamaran aktif.');}
}
function saveMeta(){try{localStorage.setItem(METAK,JSON.stringify(meta));}catch(e){}}
function setCfg(c){c.u=Date.now();S.cfg=c;persist();}
function setBudget(p,cats){S.budget[p]={cats,u:Date.now()};persist();}
function putTx(t){t.u=Date.now();S.tx[t.id]=t;persist();}
function delTx(id){S.tx[id]={id,del:true,u:Date.now()};persist();}

function setSync(){
  const el=$('#sync');const on=navigator.onLine;
  el.className='sync '+(on?'on':'local');
  el.textContent=(on?'Online':'Offline, tetap bisa mencatat')+'. Data tersimpan di perangkat ini. Terakhir gabung data: '+fmtTime(Math.max(meta.sent||0,meta.recv||0))+'.';
}

/* ---------- periode ---------- */
function periodStartOf(date){const [y,m,d]=parts(date);const sd=S.cfg.startDay||1;return d>=sd?ymd(y,m,sd):ymd(y,m-1,sd);}
function shiftP(start,k){const [y,m,d]=parts(start);return ymd(y,m+k,d);}
let P;
function range(){return {s:P,e:shiftP(P,1)};}
function pLabel(){
  const [y,m,d]=parts(P);
  if(d===1)return MON[m-1]+' '+y;
  const e=parts(shiftP(P,1));const last=new Date(e[0],e[1]-1,e[2]-1);
  return d+' '+MONS[m-1]+' – '+last.getDate()+' '+MONS[last.getMonth()]+' '+last.getFullYear();
}

/* ---------- data helpers ---------- */
function allTx(){return Object.values(S.tx).filter(t=>t&&!t.del&&t.date);}
function periodTx(){const {s,e}=range();return allTx().filter(t=>t.date>=s&&t.date<e);}
const byId=(list,id)=>list.find(x=>x.id===id);
const ownerName=o=>o?memName(o):'Bersama';
const accTag=a=>a.kind==='aset'?(a.owner?'Aset '+memName(a.owner):'Aset'):ownerName(a.owner);
const accName=id=>{const a=byId(S.cfg.accounts,id);return a?a.name+' ('+accTag(a)+')':'(akun terhapus)';};
const isAset=a=>!!a&&a.kind==='aset';
function asetMoved(tx){let n=0;tx.filter(t=>t.type==='tf').forEach(t=>{const f=isAset(byId(S.cfg.accounts,t.acc)),d=isAset(byId(S.cfg.accounts,t.to));if(d&&!f)n+=t.amount;if(f&&!d)n-=t.amount;});return n;}
function accGroups(first){
  const owners=[first,first==='a'?'b':'a',''];const out=[];
  owners.forEach(o=>KINDS.concat([['other','Lainnya']]).forEach(([k])=>{
    if(k==='aset')return;
    const list=S.cfg.accounts.filter(a=>(a.owner||'')===o&&(KINDS.some(x=>x[0]===a.kind)?a.kind:'other')===k);
    if(list.length)out.push({owner:o,kind:k,list});
  }));
  const aset=S.cfg.accounts.filter(isAset);
  if(aset.length)out.push({owner:null,kind:'aset',list:aset});
  return out;
}
const catName=t=>{const l=t.type==='in'?S.cfg.income:S.cfg.expense;const c=byId(l,t.cat);return c?c.name:'(tanpa akun)';};
const memName=id=>{const m=byId(S.cfg.members,id);return (m&&m.name)||(id==='a'?'Istri':'Suami');};
function sortTx(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0);}
function catColor(id){const i=S.cfg.expense.findIndex(c=>c.id===id);return PALETTE[(i<0?15:i)%PALETTE.length];}
function isUsed(kind,id){return allTx().some(t=>kind==='acc'?(t.acc===id||t.to===id):(t.cat===id));}

function syncWho(){

function fillAccSelect(sel,keep,includeId){
  const prev=keep!==undefined?keep:sel.value;let any=false;
  sel.innerHTML=accGroups(who).map(g=>{
    const items=g.list.filter(x=>!x.archived||x.id===includeId);if(!items.length)return '';any=true;

  }).join('');

}

  if(mine)sel.value=mine.id;

function txRow(t){

  const sub=[t.type==='tf'?'Transfer':(t.type==='in'?'Masuk ke ':'Dari ')+accName(t.acc),memName(t.by),t.note].filter(Boolean).join(', ');
  const sign=t.type==='out'?'−':t.type==='in'?'+':'';
  const li=document.createElement('li');
  li.innerHTML=`<span class="dot ${t.by==='b'?'b':'a'}" title="${esc(memName(t.by))}"></span>
   <div class="txt"><b>${esc(title)}</b><span>${esc(sub)}</span></div>
   <div class="amt num ${t.type}">${sign}${rp(t.amount)}</div>
   <div class="rowbtns"><button class="linkbtn" data-a="e">Ubah</button><button class="linkbtn" data-a="d">Hapus</button></div>`;

  const ul=$('#recent');ul.innerHTML='';

/* ---------- saldo ---------- */
function flow(accId,t){
  if(t.acc===accId)return t.type==='in'?t.amount:-t.amount;
  if(t.type==='tf'&&t.to===accId)return t.amount;
  return 0;
}
function accStats(a,s,e,all){
  const od=a.openDate||'0000-00-00';
  if(od>=e)return {inactive:true,od,o:0,i:0,x:0,ti:0,to:0,c:0};
  let o=+a.open||0;
  all.forEach(t=>{if(t.date>=od&&t.date<s)o+=flow(a.id,t);});
  let i=0,x=0,ti=0,to=0;
  all.forEach(t=>{if(t.date<s||t.date>=e||t.date<od)return;
    if(t.type==='in'&&t.acc===a.id)i+=t.amount;
    if(t.type==='out'&&t.acc===a.id)x+=t.amount;
    if(t.type==='tf'&&t.to===a.id)ti+=t.amount;
    if(t.type==='tf'&&t.acc===a.id)to+=t.amount;});
  return {od,o,i,x,ti,to,c:o+i-x+ti-to};
}
function cells(r,cls){return `<td class="num">${rp(r.o)}</td><td class="num">${rp(r.i)}</td><td class="num">${r.x?'−'+rp(r.x):rp(0)}</td><td class="num">${rp(r.ti)}</td><td class="num">${r.to?'−'+rp(r.to):rp(0)}</td><td class="num ${cls||''} ${r.c<0?'neg':''}">${rp(r.c)}</td>`;}
function addTo(t,r){['o','i','x','ti','to','c'].forEach(k=>t[k]+=r[k]);}
function renderSaldo(){
  const v=$('#v-saldo');const {s,e}=range();const all=allTx();
  const zero=()=>({o:0,i:0,x:0,ti:0,to:0,c:0});
  const tot=zero(),totKas=zero();const byKind={};KINDS.forEach(([k])=>byKind[k]=zero());
  let body='';
  const groups=['a','b',''].map(o=>({label:ownerName(o),list:S.cfg.accounts.filter(a=>(a.owner||'')===o&&!isAset(a))}));
  groups.push({label:'Aset',list:S.cfg.accounts.filter(isAset),aset:true});
  groups.forEach(g=>{
    const list=g.list.sort((x,y)=>kindOrder(x.kind)-kindOrder(y.kind));
    if(!list.length)return;
    const sub=zero();const o=g.label;
    body+=`<tr class="grp"><th colspan="7">${esc(g.label)}</th></tr>`;
    list.forEach(a=>{
      const r=accStats(a,s,e,all);
      if(r.inactive){body+=`<tr><td>${esc(a.name)}<span class="kind">${kindLabel(a.kind)}</span><span class="note">Saldo awal mulai ${esc(fmtDate(r.od))}</span></td><td colspan="6" class="muted" style="text-align:center">Belum aktif di periode ini</td></tr>`;return;}
      addTo(sub,r);addTo(tot,r);if(!g.aset)addTo(totKas,r);if(byKind[a.kind])addTo(byKind[a.kind],r);
      const note=r.od>s?`<span class="note">Saldo awal dicatat ${esc(fmtDate(r.od))}</span>`:(a.archived?'<span class="note">Diarsipkan</span>':'');
      body+=`<tr><td>${esc(a.name)}<span class="kind">${g.aset?(a.owner?esc(memName(a.owner)):''):kindLabel(a.kind)}</span>${note}</td>${cells(r,'end')}</tr>`;
    });
    body+=`<tr class="sub"><td>Subtotal ${esc(o)}</td>${cells(sub)}</tr>`;
  });
  const kindRows=KINDS.map(([k,l])=>`<tr><td>${l}</td>${cells(byKind[k],'end')}</tr>`).join('');
  const head='<thead><tr><th>Akun</th><th>Saldo awal</th><th>Pemasukan</th><th>Pengeluaran</th><th>Transfer masuk</th><th>Transfer keluar</th><th>Saldo akhir</th></tr></thead>';
  v.innerHTML=`<div class="panel">
    <h2>Saldo akun kas dan aset, ${esc(pLabel())}</h2>

function buildReport(){
  const {s,e}=range();const tx=periodTx();const all=allTx();
  const out=tx.filter(t=>t.type==='out'),inc=tx.filter(t=>t.type==='in');
  const sum=l=>l.reduce((a,t)=>a+t.amount,0);
  const tOut=sum(out),tIn=sum(inc);
  const bud=(S.budget[P]||{}).cats||{};
  const tBud=Object.entries(bud).reduce((a,[k,x])=>k==='_aset'?a:a+(+x||0),0);
  const tAset=+bud._aset||0,toAset=asetMoved(tx);
  const cm={};
  out.forEach(t=>{const c=cm[t.cat]||(cm[t.cat]={id:t.cat,a:0,b:0});c[t.by==='b'?'b':'a']+=t.amount;});
  Object.keys(bud).forEach(k=>{if(k!=='_aset'&&+bud[k]&&!cm[k])cm[k]={id:k,a:0,b:0};});
  const nm=id=>{const c=byId(S.cfg.expense,id);return c?c.name:'(tanpa akun)';};
  const cats=Object.values(cm).map(c=>({id:c.id,name:nm(c.id),color:catColor(c.id),a:c.a,b:c.b,amt:c.a+c.b,bud:+bud[c.id]||0}))
    .sort((x,y)=>y.amt-x.amt||y.bud-x.bud);
  const members=['a','b'].map(m=>{
    const list=cats.filter(c=>c[m]>0).map(c=>({id:c.id,name:c.name,color:c.color,amt:c[m]})).sort((x,y)=>y.amt-x.amt);
    const total=list.reduce((a,c)=>a+c.amt,0);list.forEach(c=>c.pct=total?c.amt/total:0);
    return {id:m,name:memName(m),total,list};
  });
  const im={};
  inc.forEach(t=>{const c=im[t.cat]||(im[t.cat]={a:0,b:0});c[t.by==='b'?'b':'a']+=t.amount;});
  const income=Object.entries(im).map(([id,c])=>{const k=byId(S.cfg.income,id);return {name:k?k.name:'(tanpa kategori)',a:c.a,b:c.b,amt:c.a+c.b};}).sort((x,y)=>y.amt-x.amt);
  const groups=['a','b',''].map(o=>({label:ownerName(o),aset:false,list:S.cfg.accounts.filter(a=>(a.owner||'')===o&&!isAset(a))}));
  groups.push({label:'Aset',aset:true,list:S.cfg.accounts.filter(isAset)});
  const saldo=groups.filter(g=>g.list.length).map(g=>({label:g.label,aset:g.aset,rows:g.list.slice().sort((x,y)=>kindOrder(x.kind)-kindOrder(y.kind)).map(a=>{
    const r=accStats(a,s,e,all);
    return Object.assign({name:a.name,kind:kindLabel(a.kind),owner:a.owner?memName(a.owner):''},r);
  })}));
  const txs=tx.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));
  return {label:pLabel(),s,e,tOut,tIn,tBud,tAset,toAset,cats,members,income,saldo,txs};
}

function pieSVG(list,total,size){

  if(!total)return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${r}" cy="${r}" r="${r-1}" fill="var(--sunk)" stroke="var(--line)"/></svg>`;

  let a0=0;const paths=list.map(c=>{
    const a1=a0+c.amt/total*Math.PI*2;
    const x0=r+r*Math.sin(a0),y0=r-r*Math.cos(a0),x1=r+r*Math.sin(a1),y1=r-r*Math.cos(a1);
    const large=a1-a0>Math.PI?1:0;a0=a1;
    return `<path d="M${r} ${r}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${c.color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(c.name)} ${pctf(c.pct)}</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img">${paths}</svg>`;
}

/* ---------- ZIP (untuk .xlsx) ---------- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files,type){
  const enc=new TextEncoder();const parts=[],cd=[];let off=0;
  files.forEach(f=>{
    const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);
    ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);
    ch.setUint32(38,0,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),name);off+=30+name.length+data.length;
  });
  const cdSize=cd.reduce((a,p)=>a+p.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type});
}

function buildXlsx(){
  const R=buildReport();const A=memName('a'),B=memName('b');

  for(let c=4;c<=9;c++){const L=COL(c);let v=0;for(let q=kStart;q<r;q++)v+=s2.rows[q][c].v;put(s2,r,c,v,ST.totRp,`SUM(${L}${kStart}:${L}${r-1})`);}

  /* Pemasukan */

  put(s3,1,1,'Pemasukan per Kategori',ST.title);put(s3,2,1,'Periode: '+R.label,ST.bold);
  ['Kategori',A,B,'Total','%'].forEach((h,i)=>put(s3,4,i+1,h,i?ST.headR:ST.head));
  const ni=Math.max(R.income.length,1),it=5+ni;
  if(!R.income.length)put(s3,5,1,'Belum ada pemasukan di periode ini',ST.note);

    files.push({name:'xl/drawings/_rels/drawing1.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${s1.charts.map((c,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${i+1}.xml"/>`).join('')}</Relationships>`});

  }
  return makeZip(files,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');

function tw(s,size,bold){const W=bold?HBW:HW;let w=0;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);w+=(c>=32&&c<=126)?W[c-32]:556;}return w*size/1000;}

function rgb(hex){hex=hex.replace('#','');return [0,2,4].map(i=>(parseInt(hex.substr(i,2),16)/255).toFixed(3)).join(' ');}
function buildPdf(){
  const R=buildReport();

  const pages=[];let ops,y;
  const newPage=()=>{ops=[];pages.push(ops);y=M;};
  const T=(x,yy,s,size,bold,color,align)=>{s=pdfStr(s);const w=tw(s,size,bold);if(align==='right')x-=w;else if(align==='center')x-=w/2;
    ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${rgb(color||INK)} rg ${x.toFixed(2)} ${(PH-yy).toFixed(2)} Td (${s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}) Tj ET`);};
  const RECT=(x,yy,w,h,color)=>ops.push(`${rgb(color)} rg ${x.toFixed(2)} ${(PH-yy-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
  const LN=(x1,y1,x2,y2,color,w)=>ops.push(`${rgb(color)} RG ${w||0.6} w ${x1.toFixed(2)} ${(PH-y1).toFixed(2)} m ${x2.toFixed(2)} ${(PH-y2).toFixed(2)} l S`);
  const ensure=h=>{if(y+h>BOTTOM)newPage();};
  const pie=(cx,cy,r,list,total)=>{
    const CX=cx,CY=PH-cy;
    if(!total){ops.push(`${rgb(SOFT)} rg ${rgb(LINE)} RG 0.8 w ${circ(CX,CY,r)} B`);return;}
    if(list.length===1){ops.push(`${rgb(list[0].color)} rg ${circ(CX,CY,r)} f`);return;}
    let th=0;
    list.forEach(c=>{
      const th1=th+c.amt/total*Math.PI*2;let path=`${CX.toFixed(2)} ${CY.toFixed(2)} m `;
      let p0=Math.PI/2-th;const pEnd=Math.PI/2-th1;
      path+=`${(CX+r*Math.cos(p0)).toFixed(2)} ${(CY+r*Math.sin(p0)).toFixed(2)} l `;
      while(p0-pEnd>1e-6){const p1=Math.max(pEnd,p0-Math.PI/2);const d=p1-p0,k=4/3*Math.tan(d/4);
        const x0=Math.cos(p0),y0=Math.sin(p0),x3=Math.cos(p1),y3=Math.sin(p1);
        const x1=x0-k*y0,y1=y0+k*x0,x2=x3+k*y3,y2=y3-k*x3;
        path+=`${(CX+r*x1).toFixed(2)} ${(CY+r*y1).toFixed(2)} ${(CX+r*x2).toFixed(2)} ${(CY+r*y2).toFixed(2)} ${(CX+r*x3).toFixed(2)} ${(CY+r*y3).toFixed(2)} c `;p0=p1;}
      ops.push(`${rgb(c.color)} rg 1 1 1 RG 1 w ${path}h B`);th=th1;
    });
  };
  const circ=(CX,CY,r)=>{const k=0.5523*r;return `${(CX+r).toFixed(2)} ${CY.toFixed(2)} m ${(CX+r).toFixed(2)} ${(CY+k).toFixed(2)} ${(CX+k).toFixed(2)} ${(CY+r).toFixed(2)} ${CX.toFixed(2)} ${(CY+r).toFixed(2)} c ${(CX-k).toFixed(2)} ${(CY+r).toFixed(2)} ${(CX-r).toFixed(2)} ${(CY+k).toFixed(2)} ${(CX-r).toFixed(2)} ${CY.toFixed(2)} c ${(CX-r).toFixed(2)} ${(CY-k).toFixed(2)} ${(CX-k).toFixed(2)} ${(CY-r).toFixed(2)} ${CX.toFixed(2)} ${(CY-r).toFixed(2)} c ${(CX+k).toFixed(2)} ${(CY-r).toFixed(2)} ${(CX+r).toFixed(2)} ${(CY-k).toFixed(2)} ${(CX+r).toFixed(2)} ${CY.toFixed(2)} c`;};
  const section=t=>{ensure(80);y+=10;T(M,y+11,t,12,true,BRAND);y+=20;};
  const table=(cols,rows,fs)=>{

    const head=()=>{RECT(M,y,CW,rh,HEAD);let x=M;cols.forEach(c=>{const tx=c.align==='right'?x+c.w-5:x+5;T(tx,y+rh-5.5,fitStr(c.t,fs,true,c.w-8),fs,true,INK,c.align);x+=c.w;});y+=rh;};
    ensure(rh*2);head();
    rows.forEach(row=>{
      if(y+rh>BOTTOM){newPage();head();}
      if(row.fill)RECT(M,y,CW,rh,row.fill);
      let x=M;cols.forEach((c,i)=>{const v=row.cells[i];if(v!=null&&v!==''){const tx=c.align==='right'?x+c.w-5:x+5;
        T(tx,y+rh-5.5,fitStr(v,fs,!!row.bold,c.w-8),fs,!!row.bold,(row.colors&&row.colors[i])||(row.muted?MUT:INK),c.align);}x+=c.w;});
      y+=rh;LN(M,y,M+CW,y,row.bold?INK:LINE,row.bold?0.8:0.4);

  /* angka utama */

    ['Anggaran belanja',R.tBud],['Sisa anggaran',R.tBud?R.tBud-R.tOut:null],['Target ke aset',R.tAset||null],['Pengeluaran '+memName('a')+' / '+memName('b'),null]];
  const bw=(CW-3*8)/4,bh=42;
  boxes.forEach((b,i)=>{const bx=M+(i%4)*(bw+8),by=y+Math.floor(i/4)*(bh+8);RECT(bx,by,bw,bh,SOFT);
    T(bx+8,by+14,fitStr(b[0],8,false,bw-16),8,false,MUT);
    let val;if(i===7)val=pct(R.tOut?R.members[0].total/R.tOut:0)+' / '+pct(R.tOut?R.members[1].total/R.tOut:0);else val=b[1]==null?'-':rp(b[1]);
    T(bx+8,by+32,fitStr(val,12,true,bw-16),12,true,(typeof b[1]==='number'&&b[1]<0)?RED:INK);});
  y+=2*bh+8+6;
  /* pie per pencatat */
  section('Komposisi pengeluaran per pencatat');
  const colW=(CW-20)/2,rad=62;
  const blockH=m=>36+rad*2+14+Math.max(1,m.list.length)*12;
  ensure(Math.max(...R.members.map(blockH)));
  const top=y;let bottom=y;
  R.members.forEach((m,mi)=>{
    const x0=M+mi*(colW+20);let yy=top;
    RECT(x0,yy,colW,24,SOFT);
    RECT(x0+8,yy+8,8,8,m.id==='a'?'#B4466A':'#3A5A9A');
    T(x0+22,yy+16,m.name,10,true,INK);T(x0+colW-8,yy+16,rp(m.total),10,true,INK,'right');yy+=36;
    pie(x0+colW/2,yy+rad,rad,m.list,m.total);yy+=rad*2+14;
    if(!m.list.length){T(x0,yy+8,'Belum ada pengeluaran di periode ini.',8.5,false,MUT);yy+=12;}
    m.list.forEach(c=>{RECT(x0,yy+1,7,7,c.color);T(x0+12,yy+8,fitStr(c.name,8,false,colW-130),8,false,INK);
      T(x0+colW-72,yy+8,pct(c.pct),8,false,MUT,'right');T(x0+colW,yy+8,rp(c.amt),8,true,INK,'right');yy+=12;});
    bottom=Math.max(bottom,yy);
  });
  y=bottom+6;
  /* rincian beban */
  section('Rincian pengeluaran per akun beban');
  const A=memName('a'),B=memName('b');
  const cw=[128,66,66,70,40,70,75];
  const cols=[{t:'Akun beban',w:cw[0]},{t:A,w:cw[1],align:'right'},{t:B,w:cw[2],align:'right'},{t:'Total',w:cw[3],align:'right'},{t:'%',w:cw[4],align:'right'},{t:'Anggaran',w:cw[5],align:'right'},{t:'Sisa',w:cw[6],align:'right'}];
  const rows=R.cats.map(c=>({cells:[c.name,rp(c.a),rp(c.b),rp(c.amt),pct(R.tOut?c.amt/R.tOut:0),c.bud?rp(c.bud):'-',c.bud?rp(c.bud-c.amt):'-'],colors:[null,null,null,null,null,null,c.bud&&c.amt>c.bud?RED:null]}));
  if(!rows.length)rows.push({cells:['Belum ada pengeluaran di periode ini'],muted:true});
  rows.push({bold:true,fill:SOFT,cells:['Total',rp(R.members[0].total),rp(R.members[1].total),rp(R.tOut),R.tOut?'100%':'0%',R.tBud?rp(R.tBud):'-',R.tBud?rp(R.tBud-R.tOut):'-'],colors:[null,null,null,null,null,null,R.tBud&&R.tOut>R.tBud?RED:null]});
  table(cols,rows);
  ensure(20);y+=14;
  T(M,y,'Tabungan dan investasi: dipindah ke aset '+rp(R.toAset)+(R.tAset?' dari target '+rp(R.tAset)+' ('+pct(R.toAset/R.tAset)+').':'.'),8.5,false,MUT);y+=6;
  /* pemasukan */
  section('Pemasukan per kategori');
  const icol=[{t:'Kategori',w:195},{t:A,w:85,align:'right'},{t:B,w:85,align:'right'},{t:'Total',w:95,align:'right'},{t:'%',w:CW-460,align:'right'}];
  const irows=R.income.map(c=>({cells:[c.name,rp(c.a),rp(c.b),rp(c.amt),pct(R.tIn?c.amt/R.tIn:0)]}));
  if(!irows.length)irows.push({cells:['Belum ada pemasukan di periode ini'],muted:true});
  irows.push({bold:true,fill:SOFT,cells:['Total',rp(R.income.reduce((a,c)=>a+c.a,0)),rp(R.income.reduce((a,c)=>a+c.b,0)),rp(R.tIn),R.tIn?'100%':'0%']});
  table(icol,irows);
  /* saldo */
  section('Saldo akun kas dan aset');
  const scol=[{t:'Akun',w:103},{t:'Saldo awal',w:69,align:'right'},{t:'Pemasukan',w:68,align:'right'},{t:'Pengeluaran',w:68,align:'right'},{t:'Transfer masuk',w:68,align:'right'},{t:'Transfer keluar',w:68,align:'right'},{t:'Saldo akhir',w:CW-444,align:'right'}];
  const srows=[];const Z=()=>({o:0,i:0,x:0,ti:0,to:0,c:0});const tk=Z(),ta=Z();
  const fmtRow=(name,r,opt)=>Object.assign({cells:[name,rp(r.o),rp(r.i),r.x?'-'+rp(r.x):rp(0),rp(r.ti),r.to?'-'+rp(r.to):rp(0),rp(r.c)],colors:[null,null,null,null,null,null,r.c<0?RED:null]},opt||{});
  R.saldo.forEach(g=>{
    srows.push({bold:true,fill:HEAD,cells:[g.label]});
    const sub=Z();
    g.rows.forEach(a=>{
      if(a.inactive){srows.push({cells:[a.name+' ('+(g.aset?'Aset':a.kind)+')','Belum aktif'],muted:true});return;}
      ['o','i','x','ti','to','c'].forEach(k=>{sub[k]+=a[k];ta[k]+=a[k];if(!g.aset)tk[k]+=a[k];});
      srows.push(fmtRow(a.name+(g.aset?'':' ('+a.kind+')'),a));

  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';

  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  pobj.forEach(p=>{objs[p.pid]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${p.cid} 0 R >>`;
    objs[p.cid]=`<< /Length ${p.content.length} >>\nstream\n${p.content}\nendstream`;});
  const infoId=objs.length;objs[infoId]=`<< /Title (${pdfStr('Laporan Kas Rumah '+R.label).replace(/[()\\]/g,'')}) /Producer (Kas Rumah) >>`;
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
  for(let i=1;i<objs.length;i++){offs[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`;}
  const xref=out.length;
  out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+offs.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R /Info ${infoId} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;

}

/* ---------- gabung data ---------- */
function exportPayload(){
  return JSON.stringify({app:'kasrumah',v:2,from:memName(who),exportedAt:Date.now(),cfg:S.cfg,tx:S.tx,budget:S.budget});
}
function fileName(prefix){const d=new Date();return prefix+'-'+memName(who).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+today()+'-'+pad(d.getHours())+pad(d.getMinutes())+'.json';}
async function sendData(){
  const name=fileName('kas-rumah');const text=exportPayload();
  try{
    const file=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Data Kas Rumah',text:'Data Kas Rumah dari '+memName(who)+'. Buka Kas Rumah, tab Gabung data, lalu tekan Terima data.'});
      meta.sent=Date.now();saveMeta();render();toast('Data terkirim.');return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;}
  downloadFile(name,text,'application/json');
  meta.sent=Date.now();saveMeta();render();
  toast('File tersimpan di folder unduhan. Kirim file itu ke pasanganmu.');
}
function mergeData(j){
  if(!j||j.app!=='kasrumah'||typeof j.tx!=='object')throw new Error('bad');
  let added=0,updated=0,removed=0;
  for(const [id,r] of Object.entries(j.tx||{})){
    if(!r||typeof r!=='object')continue;
    const l=S.tx[id];
    if(!l){S.tx[id]=r;if(r.del)continue;added++;}
    else if((+r.u||0)>(+l.u||0)){S.tx[id]=r;if(r.del&&!l.del)removed++;else if(!r.del)updated++;}
  }
  let cfgTaken=false;
  if(j.cfg&&(+j.cfg.u||0)>(+S.cfg.u||0)){S.cfg=normCfg(j.cfg);cfgTaken=true;}
  for(const [p,b] of Object.entries(j.budget||{})){
    const l=S.budget[p];if(!l||(+b.u||0)>(+l.u||0))S.budget[p]=b;
  }
  persist();
  return {added,updated,removed,cfgTaken};
}
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    const r=mergeData(j);
    meta.recv=Date.now();saveMeta();
    P=periodStartOf(P);render(true);
    const parts2=[];
    if(r.added)parts2.push(r.added+' transaksi baru');
    if(r.updated)parts2.push(r.updated+' diperbarui');
    if(r.removed)parts2.push(r.removed+' dihapus');
    toast(parts2.length?'Data dari '+(j.from||'pasangan')+' digabung: '+parts2.join(', ')+'.':'Data sudah sama, tidak ada yang baru.');
  }catch(err){toast('File ini bukan data Kas Rumah. Pilih file .json yang dikirim dari aplikasi ini.');}
});

    const used=isUsed(kind==='accounts'?'acc':'cat',c.id);
    const btn=c.archived?'Aktifkan lagi':(used?'Arsipkan':'Hapus');
    if(kind==='accounts')return `<div class="editrow acc ${c.archived?'archived':''}"><input type="text" value="${esc(c.name)}" data-k="${kind}" data-i="${i}" data-f="name" aria-label="Nama akun"><select data-k="${kind}" data-i="${i}" data-f="owner" aria-label="Pemilik">${ownerOpts(c.owner||'')}</select><select data-k="${kind}" data-i="${i}" data-f="kind" aria-label="Jenis akun">${kindOpts(c.kind)}</select><input type="text" inputmode="numeric" class="num" value="${(+c.open||0).toLocaleString('id-ID')}" data-k="${kind}" data-i="${i}" data-f="open" aria-label="Saldo awal"><input type="date" value="${esc(c.openDate||'')}" data-k="${kind}" data-i="${i}" data-f="openDate" aria-label="Tanggal saldo awal"><button class="btn ghost sm" data-rm="${kind}" data-i="${i}">${btn}</button></div>`;
    return `<div class="editrow ${c.archived?'archived':''}"><input type="text" value="${esc(c.name)}" data-k="${kind}" data-i="${i}" data-f="name" aria-label="Nama"><button class="btn ghost sm" data-rm="${kind}" data-i="${i}">${btn}</button></div>`;
  }).join('');
  v.innerHTML=`
  <div class="grid2">
    <div class="panel">
      <h2>Pencatat dan periode</h2>
      <div class="row">
        <div class="field"><label for="m0">Pencatat 1</label><input id="m0" type="text" value="${esc(draft.members[0].name)}" maxlength="20"></div>
        <div class="field"><label for="m1">Pencatat 2</label><input id="m1" type="text" value="${esc(draft.members[1].name)}" maxlength="20"></div>
      </div>
      <div class="field"><label for="sd">Periode dimulai setiap tanggal</label>
        <select id="sd">${Array.from({length:28},(_,i)=>`<option value="${i+1}" ${draft.startDay===i+1?'selected':''}>${i+1}${i===0?' (per bulan kalender)':''}</option>`).join('')}</select>
        <span class="muted small">Pilih tanggal gajian kalau anggaran kalian mengikuti gaji, misalnya 25.</span></div>
      <h3>Kategori pemasukan</h3>
      <div class="editlist">${listRows('income',draft.income)}</div>
      <div class="addrow"><input type="text" id="addInc" placeholder="Kategori pemasukan baru"><button class="btn ghost sm" data-add="income">Tambah</button></div>
    </div>
    <div class="panel">
      <h2>Akun beban</h2>
      <div class="editlist">${listRows('expense',draft.expense)}</div>
      <div class="addrow"><input type="text" id="addExp" placeholder="Akun beban baru"><button class="btn ghost sm" data-add="expense">Tambah</button></div>
    </div>
  </div>
  <div class="panel">
    <h2>Akun kas</h2>
    <p class="muted small" style="margin-top:-6px">Isi saldo awal tiap akun sesuai saldo di aplikasi bank, e-wallet, atau investasi pada tanggal saldo awal. Untuk akun aset, pemilik boleh dibiarkan Bersama.</p>
    <div class="inline small"><span>Samakan tanggal saldo awal semua akun:</span><input type="date" id="allOd" value="${esc((draft.accounts[0]||{}).openDate||'')}"><button class="btn ghost sm" id="allOdBtn">Terapkan</button></div>
    <div class="acchead"><span>Nama</span><span>Pemilik</span><span>Jenis</span><span>Saldo awal</span><span>Tanggal saldo awal</span></div>
    <div class="editlist">${listRows('accounts',draft.accounts)}</div>
    <div class="addrow"><input type="text" id="addAcc" placeholder="Nama akun baru, mis. Jenius"><select id="addOwner" aria-label="Pemilik akun baru">${ownerOpts(who)}</select><select id="addKind" aria-label="Jenis akun baru">${kindOpts('bank')}</select><button class="btn ghost sm" data-add="accounts">Tambah</button></div>
  </div>
  <div class="panel" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button class="btn" id="sSave">Simpan pengaturan</button><button class="btn ghost" id="sReset">Batalkan perubahan</button>
    <span class="muted small">Atur di satu HP saja, lalu kirim data ke pasangan agar pengaturannya sama.</span>
  </div>`;
  $('#allOdBtn').onclick=()=>{const d=$('#allOd').value;if(!d)return;draft.accounts.forEach(a=>a.openDate=d);renderSettings();toast('Tanggal diterapkan. Tekan Simpan pengaturan.');};
  v.querySelectorAll('[data-k]').forEach(inp=>inp.addEventListener(inp.tagName==='SELECT'?'change':'input',()=>{
    const it=draft[inp.dataset.k][+inp.dataset.i],f=inp.dataset.f;
    if(f==='open'){const neg=inp.value.trim().startsWith('-');const d=inp.value.replace(/\D/g,'').replace(/^0+/,'');inp.value=(neg?'-':'')+(d?Number(d).toLocaleString('id-ID'):'');it.open=(neg?-1:1)*(Number(d)||0);}
    else it[f]=inp.value;
  }));
  $('#m0').oninput=e=>draft.members[0].name=e.target.value;
  $('#m1').oninput=e=>draft.members[1].name=e.target.value;
  $('#sd').onchange=e=>draft.startDay=+e.target.value;
  v.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.rm,i=+b.dataset.i,it=draft[k][i];
    if(it.archived)delete it.archived;
    else if(isUsed(k==='accounts'?'acc':'cat',it.id))it.archived=true;
    else draft[k].splice(i,1);
    renderSettings();
  });
  const addMap={accounts:'#addAcc',expense:'#addExp',income:'#addInc'};
  v.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.add,inp=$(addMap[k]),name=inp.value.trim();if(!name){inp.focus();return;}
    const it={id:uid(),name};if(k==='accounts'){it.open=0;it.openDate=(draft.accounts[0]||{}).openDate||OD;it.owner=$('#addOwner').value;it.kind=$('#addKind').value;}
    draft[k].push(it);renderSettings();$(addMap[k]).focus();
  });
  Object.entries(addMap).forEach(([k,s])=>$(s).addEventListener('keydown',e=>{if(e.key==='Enter')v.querySelector(`[data-add="${k}"]`).click();}));
  $('#sSave').onclick=()=>{
    const c=normCfg(draft);
    for(const k of ['accounts','expense','income'])for(const it of c[k]){it.name=(it.name||'').trim();if(!it.name){toast('Ada nama akun yang masih kosong.');return;}}
    c.members.forEach((m,i)=>{m.name=(m.name||'').trim()||(i?'Suami':'Istri');});
    const oldSd=S.cfg.startDay;
    setCfg(c);
    if(c.startDay!==oldSd)P=periodStartOf(today0);
    draft=null;render(true);toast('Pengaturan disimpan.');
  };
  $('#sReset').onclick=()=>{draft=null;renderSettings();};
}

/* ---------- toast ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200);}

/* ---------- mulai ---------- */
load();
P=periodStartOf(today0);
setType('out');render(true);defaultAcc();
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
})();
</script>

</body>
</html>
